<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .container{
            height: 200px;
            background-color: dodgerblue;
            /*flexible : 유연한 */
            display: flex;
            /*justify는 가로축을 의미*/
            justify-content: space-between;
        }
        .container > div{
            background-color: #f1f1f1f1;
            width: 150px;
            
            /*inline-block은 실무에서 사용하지 않음 flex가 없어도 가로로 배치 되지만 파란선을 넘는다*/
        }
    </style>
</head>
<body>
    <!-- Flex, 실무에서 사용률 100%
    1. margin,padding
    2. flex
    3. position
    홈페이지 제작 가능!

    flex는 복잡한 레이아웃을 간편하게 만들 수 있도록 도와준다. (ex. 유튜브, 인스타, 페북 등)
    크기와 위를 동적으로 조절 가능하다. (즉, 핸드폰 사이즈던 모니터 사이즈던 자동으로 줄어들고 늘어난다)
    이를 통해 다양한 디바이스(핸드폰)와 화면크기에 맞춰 레이아웃을 만들 수 있다.
-->
    <div class="container">
        <!--div는 기본 새로로 배치됨-->
        <div>
            1
            <img src="KakaoTalk_20240215_201403502.gif" alt="">

        </div>
        <div>
            2
            <img src="KakaoTalk_20240215_201405102.gif" alt="">
        </div>
        <div>
            3
            <img src="KakaoTalk_20240215_203201767.gif" alt="">
        </div>
        <div>
            4
            <img src="KakaoTalk_20240215_203206849.gif" alt="">
        </div>
    </div>
</body>
</html>
