<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .container {
        width: 1000px;
        height: 500px;
        margin: 80px auto;
        background-color: #f3f3f3;
        display: flex;
      }
      .Header {
        width: 1000px;
        height: 500px;
        text-align: left top;
        font-size: 28px;
        color: black;
        font-weight: 400;
        background-color: yellowgreen;
      }
      .Article {
        width: 600px;
        height: 300px;
        text-align: left top;
        font-size: 38px;
        color: black;
        font-weight: 400;
        background-color: #f3f3f3;
      }
      .Aside {
        width: 300px;
        height: 150px;
        text-align: left top;
        color: black;
        font-weight: 400;
        background-color: beige;
      }
      .Nav {
        width: 300px;
        height: 150px;
        text-align: left top;
        color: black;
        font-weight: 400;
        background-color: #d7e8d4;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="Header">
        Header
        <div class="Article">
          Article
          <div class="Aside"></div>
          Aside
          <div class="Nav"></div>
          Nav
        </div>
      </div>
    </div>
  </body>
</html>
