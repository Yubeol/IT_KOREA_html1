<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         *{
            
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        div{
            width: 150px;
            height: 150px;
            background-color: antiquewhite;
            border:1px solid black;
        }
        .box01{
            background-color: aqua;
            margin-bottom: 50px;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 20px;
            padding-right: 10;
        }
        .box02{
            background-color:bisque;
            margin-bottom: 50px;
            display: inline-block;
          
        }
        .box03{
            background-color:brown;
            color: white;
            margin-top: 50px;
            margin-left:100px;
            display:inline-block;
        }
    </style>
</head>
    <!--
        즐바꿈 없이 한 줄에 나열되는 테그를 inline 테그라고 한다. (가로로 배치됨, 실무 x)
    -->
<body>
    <div class="box01">박스1번</div>
        <h2>안녕하세요</h2>
    <div class="box02">박스2번</div>
        <h2>안녕하세요</h2>
    <div class="box03">박스3번</div>
        <h2>안녕하세요</h2>
</body>
</html>
