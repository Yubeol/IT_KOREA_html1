<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      .container {
        display: flex;
        height: 100vh;
        /* 1. header,main,footer를 세로 배치 */
        flex-direction: column;
      }
      .main {
        /* flex-grow: 1; flex-shrink: 1; flex-basis: 0%  */
        flex: 1;
        display: flex;
        /* main에  display: flex해야 article, nav, aside가
        가로배치 됨!*/
      }
      .article {
        flex: 1;
      }
      .nav,
      .aside {
        flex: 0 0 20vw;
      }
      .nav {
        background-color: #d7e8d4;
      }
      .aside {
        background-color: beige;
      }
      .header,
      .footer {
        background-color: yellowgreen;
        height: 20vh;
      }
      .header,
      .footer,
      .article,
      .nav,
      .aside {
        padding: 1%;
      }
    </style>
  </head>
  <body>
    <!-- 요소(태그)
    요소,태그,마크업 => <p></p>
    -->
    <div class="container">
      <div class="header">Header</div>
      <div class="main">
        <div class="article">Article</div>
        <div class="aside">Aside</div>
        <div class="nav">Nav</div>
      </div>
      <div class="footer">Footer</div>
    </div>
  </body>
</html>
